# Capability manifest: what Jarvis can do and what each capability needs.
# kind: quick   handled instantly inside jarvisd (no LLM worker)
# kind: local   delegated task; `toolsets` = the ONLY toolsets the LOCAL backend gets via -t
#               (the cloud backend always runs the full default-profile toolset)
# kind: worker  delegated task for the cloud worker (no local toolset diet)
# hint: passed to the worker as context, so it knows WHICH tools/accounts fit the request.
# Codex / Claude Code are never chosen from here, only when the user names them.
# keywords are matched lexically + by embedding; keep them spoken-language flavored.

- id: time.now
  kind: quick
  name: current time and date
  keywords: [time, date, clock, today, "what day"]
- id: system.status
  kind: quick
  name: system and jarvis health status
  keywords: [status, health, memory usage, ram, uptime, "are you ok", diagnostics]
- id: tasks.list
  kind: quick
  name: list active and recent tasks
  keywords: [tasks, jobs, "what are you working on", progress, queue]
- id: say.again
  kind: quick
  name: repeat last reply
  keywords: [repeat, again, "say that again", pardon]

- id: files.search
  kind: local
  name: find or read files on this Mac
  toolsets: [file]
  keywords: [find file, read file, search files, folder, directory, open file, list files]
- id: files.edit
  kind: local
  name: create or modify a file
  toolsets: [file]
  keywords: [write file, edit, save note, create file, append]
- id: shell.ops
  kind: local
  name: run terminal commands / process checks
  toolsets: [terminal]
  keywords: [run command, terminal, process, kill, restart service, disk space, logs]
- id: shell.files
  kind: local
  name: combined file + terminal task
  toolsets: [file, terminal]
  keywords: [script, install, move files, backup, archive, organize]
- id: code.big
  kind: worker
  name: substantial coding or refactoring job
  hint: "Work in the named repo under ~/ai/repos; use your coding subagent (delegation) for multi-file changes; run the repo's tests before reporting."
  keywords: [implement, refactor, fix bug, write code, build feature, tests]
- id: research.big
  kind: worker
  name: deep research or audit
  hint: "Use web search plus the Obsidian vault (~/ai/memory/obsidian-vault) and give a short spoken conclusion first."
  keywords: [audit, deep research, analyze repo, investigate, report]
- id: mail.inbox
  kind: worker
  name: read, summarize or draft email
  hint: "Email = the mail_* tools (mail_status, mail_threads, mail_thread, mail_draft_create). Accounts: persoscan (info@persoscan.com) and nimbas (info@nimbas.lt); check both unless one is named. Send only when the task says 'confirmed by user'; otherwise draft."
  keywords: [email, emails, inbox, mail, unread, reply to, draft, message from]
- id: web.current
  kind: worker
  name: current information from the web (weather, news, prices, opening hours)
  hint: "Use web search; give the figure with its source and time. Location defaults to Vilnius, Lithuania."
  keywords: [weather, forecast, news, price, stock, bitcoin, score, open now, latest, today]
- id: matrix.message
  kind: worker
  name: send the user a message or file on their phone (Matrix)
  hint: "Send with ~/ai/bin/notify --room jarvis-voice \"text\" (or --media <file> \"caption\"). Never call chat APIs directly."
  keywords: [send me, text me, message me, to my phone, share the link]
- id: reminders
  kind: quick
  name: reminders (set_reminder tool, handled by Jarvis itself)
  keywords: [remind me, reminder, alarm, timer, "in minutes"]
- id: web.browse
  kind: local
  name: open and read a web page in the browser (read-only)
  # Structured browser_* tools measured 8/8 on read/navigate/extract (2026-08-31,
  # browser_ab runs 1+2). Interactive flows (forms, multi-step) measured
  # unreliable — this capability is READ-ONLY by toolset scope on purpose.
  toolsets: [browser, web]
  keywords: [open page, read website, browse, look at site, check webpage, page title]
