[server]
host = "127.0.0.1"
port = 9140

[ollama]
url = "http://127.0.0.1:11434"          # still used for the embedding model
# One model serves both roles (measured 2026-08-30, see docs/VOICE_MODEL_ABX.md).
# Gemma E4B was the faster talker (0.48s vs 0.89s to first spoken word) but got
# only 5/10 on the mediator's own routing contract -- it invented the clock time
# rather than calling time.now, and said "I'll remember that" without ever
# calling memory.note, silently losing the fact. gpt-oss scores 8/10 at the same
# tool-turn latency, and sharing one model with the worker removes the eviction
# that used to cost a 6.5s cold reload after every delegated task.
mediator = "gpt-oss-20b-mxfp4"
mediator_url = "http://127.0.0.1:8090"  # model router
mediator_native = true                   # real tool schemas, not the JSON line
worker = "gpt-oss-20b-mxfp4"
embed = "nomic-embed-text"
mediator_num_ctx = 8192
keep_alive = "30m"

[stt]
model = "base.en"
compute = "int8"
device = "cpu"
partial_interval_ms = 600

[vad]
aggressiveness = 3
endpoint_ms = 500
min_speech_ms = 200

[tts]
voice = "am_michael"
speed = 1.1
engine = "kokoro"
fallback = "say"

[paths]
vault = "~/ai/memory/obsidian-vault"
hermes_home = "~/.hermes/profiles/jarvis-voice"
models = "~/ai/models"

[budgets]
context_card_tokens = 600
mediator_history_turns = 6

[worker]
backend = "local"
